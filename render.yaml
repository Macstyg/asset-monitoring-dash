services:
  - type: web
    name: asset-monitoring-dash
    runtime: elixir
    plan: free
    branch: main
    autoDeployTrigger: commit
    buildCommand: ./build.sh
    startCommand: ./bin/render-start.sh
    envVars:
      - key: ELIXIR_VERSION
        value: 1.19.5
      - key: ERLANG_VERSION
        value: 28.3.1
      - key: NODE_VERSION
        value: 24.10.0
      - key: MIX_ENV
        value: prod
      - key: POOL_SIZE
        value: "2"
      - key: ECTO_SSL
        value: "true"
      - key: SECRET_KEY_BASE
        sync: false
      - key: DATABASE_URL
        sync: false
